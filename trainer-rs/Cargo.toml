[workspace]
resolver = "3"
members = ["trainer-core", "trainer-web"]

# Shared across both crates so versions can never drift between the native and
# browser tiers.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
async-trait = "0.1"
