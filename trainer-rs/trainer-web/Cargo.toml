[package]
name = "trainer-web"
version.workspace = true
edition.workspace = true
license.workspace = true

# Browser-facing layer: the IndexedDB Storage implementation in this change, and
# the Dioxus views in rust-ui. Everything here needs a browser, so its tests run
# under wasm-bindgen-test rather than `cargo test`.
[dependencies]
trainer-core = { path = "../trainer-core" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
async-trait.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# Already in the tree via dioxus; named here because the infinite-scroll hook
# uses the channel directly. The IntersectionObserver callback runs outside
# Dioxus's runtime, so it sends on a plain channel rather than touching signals.
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }

# Client-side rendering only. "web" and "router" are the whole surface: no
# fullstack, server, ssr, desktop or mobile, since the app is a static bundle on
# GitHub Pages with no server of any kind.
#
# 0.7.10 rather than the 0.8 alpha — this is a shipping app.
dioxus = { version = "0.7.10", features = ["web", "router"] }

# Feature-gated: web-sys ships bindings only for what is enabled here, so this
# list grows deliberately. IndexedDB only for rust-foundation; rust-ui adds
# Geolocation, Notification, ServiceWorkerRegistration, and IntersectionObserver.
[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Storage",
  "IdbFactory",
  "IdbDatabase",
  "IdbObjectStore",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
  "IdbVersionChangeEvent",
  "DomStringList",
  "DomException",
  "Event",
  "EventTarget",

  # rust-ui: geolocation, replacing geolocation-helper.js
  "Navigator",
  "Geolocation",
  "Position",
  "PositionError",
  "PositionOptions",
  "Coordinates",

  # rust-ui: notifications, replacing notification-helper.js
  "Notification",
  "NotificationOptions",
  "NotificationPermission",
  "ServiceWorkerContainer",
  "ServiceWorkerRegistration",

  # rust-ui: infinite scroll, replacing infinite-scroll.js
  "IntersectionObserver",
  "IntersectionObserverInit",
  "IntersectionObserverEntry",

  # rust-ui: document access for the shell and the base-path lookup
  "Document",
  "Element",
  "HtmlElement",
  "HtmlBaseElement",
  "Location",

  # rust-ui: the decimal amount field reformats its own element, reproducing
  # decimal-input.js without a controlled-input round trip
  "HtmlInputElement",

  # rust-ui: the export download, replacing window.downloadFile
  "Blob",
  "BlobPropertyBag",
  "Url",
]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[dev-dependencies]
trainer-core = { path = "../trainer-core", features = ["test-support"] }
