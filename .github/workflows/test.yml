name: Run Tests

on:
  pull_request:
    types: [ opened, synchronize ]
  push:
    branches: [ main ]

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trainer-rs

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
        components: rustfmt, clippy

    # Cold Rust builds take minutes. Also caches ~/.cargo/bin, so the
    # wasm-bindgen-cli install below is paid once rather than every run.
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: trainer-rs

    - name: Formatting
      run: cargo fmt --check

    # Clippy must run against BOTH targets: trainer-web's browser code and its
    # entire test module are cfg'd to wasm32 and are invisible to a host-only
    # run, which would leave about half the crate unlinted.
    - name: Lint (host)
      run: cargo clippy --all-targets -- -D warnings

    - name: Lint (wasm32)
      run: cargo clippy --target wasm32-unknown-unknown -p trainer-web --all-targets -- -D warnings

    - name: Native tests
      run: cargo test -p trainer-core

    # The .NET job this replaced ran a TZ matrix, because the C# converter
    # recomputed each timestamp's offset from TimeZoneInfo.Local on write and so
    # produced machine-dependent bytes. `TrainerTime` keeps the offset it parsed
    # instead, which should make the native tier timezone-independent — but that
    # is a property worth proving rather than assuming, and re-running the
    # already-built tests under a second zone costs seconds. Kolkata has a
    # positive offset with a non-zero minute component, which is the shape that
    # exposed the bug in the C#.
    - name: Native tests (TZ=Asia/Kolkata)
      env:
        TZ: Asia/Kolkata
      run: cargo test -p trainer-core

    # wasm-bindgen-test-runner must match the wasm-bindgen crate version exactly
    # or the browser tier fails at runtime with an unhelpful message. Read from
    # Cargo.lock rather than hardcoded, so a dependency bump cannot desync it.
    - name: Install wasm-bindgen-cli matching Cargo.lock
      run: |
        version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)
        if [ -z "$version" ]; then
          echo "::error::Could not read the wasm-bindgen version from Cargo.lock"
          exit 1
        fi
        echo "Pinning wasm-bindgen-cli to $version"
        if [ "$(wasm-bindgen --version 2>/dev/null | awk '{print $2}')" = "$version" ]; then
          echo "Already installed and matching; skipping."
        else
          cargo install wasm-bindgen-cli --version "$version" --locked
        fi

    # Chrome and ChromeDriver ship on the GitHub Ubuntu runner images. Chrome
    # only, deliberately: see the design's browser-engine decision.
    - name: Locate headless Chrome
      run: |
        driver=$(command -v chromedriver || true)
        if [ -z "$driver" ]; then
          echo "::error::chromedriver is not on PATH; the runner image changed"
          exit 1
        fi
        echo "CHROMEDRIVER=$driver" >> "$GITHUB_ENV"
        chromedriver --version
        google-chrome --version || true

    - name: Browser tests
      run: cargo test --target wasm32-unknown-unknown -p trainer-web

    # The fixtures are golden data; a test that rewrites one would make the
    # suite self-confirming. Nothing may be modified by a test run.
    - name: Fixtures unchanged by the test run
      working-directory: ${{ github.workspace }}
      run: |
        if ! git diff --quiet -- trainer-rs/tests/fixtures; then
          echo "::error::A test modified a committed fixture:"
          git --no-pager diff --stat -- trainer-rs/tests/fixtures
          exit 1
        fi
        echo "Fixtures untouched."
